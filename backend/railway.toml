# Railway deployment for the assessment follow-up service.
#
# One process serves the HTTP API (the intake webhook from the Periskope
# automation, plus Slack's event callbacks) and runs the daily nudge cron, so
# the service must stay awake -- don't put it behind serverless/sleep settings.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# No migration step: the two tables live in the group-creation service's
# Supabase project and are created once by running sql/001_init.sql there.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Must stay at 1. node-cron ticks inside every replica, so a second one would
# post a duplicate nudge into every open Slack thread each day.
numReplicas = 1
